[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencode-vs-stockfish"
version = "0.1.0"
description = "Autonomous OpenCode versus Stockfish chess with an MCP chess server and local live board"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "OpenCode vs Stockfish contributors"}]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "python-chess>=1.999",
  "mcp>=1.12,<2.0",
  "httpx>=0.27,<1.0",
]

[project.scripts]
opencode-chess = "opencode_chess.runner:main"
opencode-chess-mcp = "opencode_chess.mcp_server:main"
opencode-chess-web = "opencode_chess.web:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
